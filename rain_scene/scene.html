<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// "Endless Rain" v2 — early Earth. Flat-vector illustration built from faceted rock objects,
// depth-graded palette, warm lava key light vs cool storm fill, pill clouds, rim-lit water.
const W = 1280, H = 720, DUR = 12;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- helpers ----------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, t) => ease(clamp((t - a) / (b - a)));
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
function mix(c1, c2, t) { const a = hex(c1), b = hex(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(t))).toString(16).padStart(2, '0')).join(''); }
function poly(pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.4, `rgba(${rgb},${a * .35})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// ---------- palette (storm-cool fill, lava-warm key) ----------
const P = {
  skyTop: '#0f1a3d', skyMid: '#24407a', skyHor: '#e0705a', fog: '#5c79b0',
  lit: '#c8705f', litWarm: '#ff9b6a', mid: '#7a3d5c', shadow: '#3a1f48', deep: '#1c1030', speck: '#2a1538',
  hi: '#ffc4a0', water: '#1b6f9a', waterDeep: '#0e3566', rim: '#6ff2ff',
  lava: '#ff5a2a', lavaHot: '#ffd166', cloudLit: '#7f8fd0', cloud: '#3d4c8f', cloudDark: '#26306a',
  text: '#ffffff', accent: '#ff4f7b'
};

// ---------- rock generator: faceted mound with lit face, shadow face, highlight, specks ----------
function makeRock(r, x, base, w, h) {
  const peakX = x + (r() - .5) * w * .3, peakY = base - h;
  const L = [], R = [];
  const nL = 3 + Math.floor(r() * 3), nR = 3 + Math.floor(r() * 3);
  for (let i = 1; i < nL; i++) { const u = i / nL; L.push([lerp(x - w / 2, peakX, u) + (r() - .5) * w * .06, lerp(base, peakY, Math.pow(u, .8)) + (r() - .5) * h * .12]); }
  for (let i = 1; i < nR; i++) { const u = i / nR; R.push([lerp(peakX, x + w / 2, u) + (r() - .5) * w * .06, lerp(peakY, base, Math.pow(u, 1.2)) + (r() - .5) * h * .12]); }
  const outline = [[x - w / 2, base], ...L, [peakX, peakY], ...R, [x + w / 2, base]];
  const ridgeEnd = [peakX + w * (.05 + r() * .2), base];
  const ridgeMid = [lerp(peakX, ridgeEnd[0], .5) + (r() - .5) * w * .1, lerp(peakY, base, .5)];
  const lit = [[x - w / 2, base], ...L, [peakX, peakY], ridgeMid, ridgeEnd];
  const hl = [];
  const top = [...L.slice(Math.floor(L.length / 2)), [peakX, peakY]];
  top.forEach(p => hl.push(p));
  for (let i = top.length - 1; i >= 0; i--) hl.push([top[i][0] + w * .05, top[i][1] + h * .1]);
  const specks = Array.from({ length: 2 + Math.floor(r() * 5) }, () => ({ u: r(), v: .25 + r() * .65, l: .04 + r() * .08, a: r() * .6 - .3 }));
  return { x, base, w, h, outline, lit, hl, specks, peakX, peakY };
}
function drawRock(k, depth, lavaLight, flash) {
  const fogT = 1 - depth;
  const shadowC = mix(mix(P.shadow, P.deep, depth), P.fog, fogT * .75);
  const litC = mix(mix(P.lit, P.litWarm, lavaLight), P.fog, fogT * .6);
  const midC = mix(P.mid, P.fog, fogT * .7);
  poly(k.outline, mix(shadowC, '#b7c4ff', flash * .3));
  poly(k.lit, mix(litC, '#ffe2f0', flash * .35));
  ctx.save(); ctx.beginPath(); k.lit.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.clip();
  poly([[k.x - k.w, k.base], [k.x - k.w, k.base - k.h * .28], [k.x + k.w, k.base - k.h * .18], [k.x + k.w, k.base]], midC);
  ctx.restore();
  poly(k.hl, mix(mix(P.hi, P.fog, fogT * .5), '#ffffff', flash * .4));
  ctx.strokeStyle = mix(P.speck, P.fog, fogT * .7); ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.2, k.w * .018);
  k.specks.forEach(s => {
    const px = k.x - k.w / 2 + s.u * k.w, py = k.base - s.v * k.h * (1 - Math.abs(s.u - .5) * 1.4);
    if (py > k.base - 2) return;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(s.a) * s.l * k.w, py + Math.sin(s.a) * s.l * k.w); ctx.stroke();
  });
}

// ---------- world ----------
const ROWS = [
  { y: 372, n: 16, s: 50, d: .05, par: .1 }, { y: 400, n: 13, s: 80, d: .2, par: .2 },
  { y: 440, n: 10, s: 120, d: .38, par: .35 }, { y: 500, n: 8, s: 170, d: .55, par: .55 },
  { y: 590, n: 6, s: 240, d: .75, par: .8 }, { y: 720, n: 4, s: 360, d: 1, par: 1.15 },
];
const rows = ROWS.map((R, ri) => {
  const rr = rng(100 + ri), rocks = [];
  for (let i = 0; i < R.n; i++) {
    const w = R.s * (.8 + rr() * .9), h = w * (.35 + rr() * .45);
    const x = -150 + (i + rr() * .8) * ((W + 400) / R.n);
    if (ri === 5 && x > 250 && x < 900) continue;
    rocks.push(makeRock(rr, x, R.y + rr() * R.s * .15, w, h));
  }
  rocks.sort((a, b) => a.base - b.base);
  return { ...R, rocks };
});
const cliff = (() => { const r = rng(9); return makeRock(r, 40, 760, 640, 470); })();
const clouds = (() => {
  const r = rng(5), out = [];
  for (let l = 0; l < 4; l++) for (let i = 0; i < 7; i++) out.push({ l, x: r() * (W + 800) - 400, y: 30 + l * 52 + r() * 40, w: 180 + r() * 340 - l * 20, h: 22 + r() * 18 + l * 3 });
  return out;
})();
const rain = [
  { n: 300, len: 14, w: 1, speed: 1000, a: .22 }, { n: 180, len: 28, w: 1.6, speed: 1500, a: .38 }, { n: 60, len: 60, w: 2.6, speed: 2200, a: .5 },
].map((L, i) => { const r = rng(300 + i); L.drops = Array.from({ length: L.n }, () => [r() * (W + 400), r() * H, .75 + r() * .5]); return L; });
const splashes = (() => { const r = rng(55); return Array.from({ length: 90 }, () => ({ x: r(), y: r(), ph: r(), s: .7 + r() * .8 })); })();
const embers = (() => { const r = rng(66); return Array.from({ length: 40 }, () => ({ x: r(), ph: r(), s: .5 + r() })); })();
const grain = (() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gx = g.getContext('2d'), id = gx.createImageData(256, 256), r = rng(999);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
  gx.putImageData(id, 0, 0); return g;
})();

function bolt(x0, y0, x1, y1, seed, width) {
  const r = rng(seed); let pts = [[x0, y0], [x1, y1]];
  for (let it = 0; it < 6; it++) {
    const np = [];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      np.push(a, [(a[0] + b[0]) / 2 + (r() - .5) * d * .4, (a[1] + b[1]) / 2 + (r() - .5) * d * .08]); }
    np.push(pts[pts.length - 1]); pts = np;
  }
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.lineWidth = width; ctx.stroke();
}
function title(str, x, y, size, alpha, weight = 800) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px "Inter Display", Inter, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(10,10,40,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3; ctx.fillStyle = P.text; ctx.fillText(str, x, y);
  ctx.restore();
}

// ---------- frame ----------
function render(t) {
  const prog = ease(t / DUR);
  const cam = { z: lerp(1.0, 1.12, prog), x: lerp(30, -60, prog), y: Math.sin(t * .6) * 2 };
  const flash = Math.max(0, 1 - Math.abs(t - 3.0) * 8) + Math.max(0, 1 - Math.abs(t - 3.22) * 12) * .7 + Math.max(0, 1 - Math.abs(t - 8.4) * 7) * .85;
  const water = smooth(.5, 11.5, t);
  const lavaK = 1 - water * .65;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sg = ctx.createLinearGradient(0, 0, 0, 420);
  sg.addColorStop(0, mix(P.skyTop, '#6a7be0', flash * .7)); sg.addColorStop(.55, mix(P.skyMid, '#9fb0ff', flash * .6));
  sg.addColorStop(1, mix(mix(P.skyHor, P.fog, water * .5), '#ffd0e0', flash * .4));
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

  ctx.setTransform(cam.z, 0, 0, cam.z, (1 - cam.z) * W / 2, (1 - cam.z) * H * .5 + cam.y);
  const at = par => cam.x * par;

  if (flash > .05) {
    ctx.save(); ctx.strokeStyle = `rgba(240,245,255,${clamp(flash)})`; ctx.shadowColor = '#cfe0ff'; ctx.shadowBlur = 26;
    if (t < 6) { bolt(860, -10, 790, 360, 11, 4); bolt(830, 150, 900, 280, 12, 2); } else bolt(330, -10, 400, 360, 13, 4);
    ctx.restore();
  }
  clouds.forEach(c => {
    const x = ((c.x + t * (8 + c.l * 6) + at(.05 + c.l * .03)) % (W + 800)) - 400;
    const f = flash * (.6 - c.l * .1);
    ctx.fillStyle = mix(P.cloudDark, '#8a95e0', f); ctx.beginPath(); ctx.roundRect(x, c.y + 6, c.w, c.h, c.h / 2); ctx.fill();
    ctx.fillStyle = mix(P.cloud, '#b0b9ff', f); ctx.beginPath(); ctx.roundRect(x + 6, c.y, c.w - 12, c.h, c.h / 2); ctx.fill();
    ctx.fillStyle = mix(P.cloudLit, '#e8ecff', f); ctx.beginPath(); ctx.roundRect(x + c.w * .15, c.y, c.w * .5, c.h * .35, c.h * .2); ctx.fill();
  });

  glow(820 + at(.1), 380, 520, '255,100,60', .55 * lavaK);

  rows.forEach((R, ri) => {
    const hg = ctx.createLinearGradient(0, R.y - R.s * .9, 0, R.y);
    hg.addColorStop(0, 'rgba(92,121,176,0)'); hg.addColorStop(1, `rgba(92,121,176,${.35 - ri * .05})`);
    ctx.fillStyle = hg; ctx.fillRect(-300, R.y - R.s * .9, W + 600, R.s * .9);
    ctx.fillStyle = mix(mix(P.shadow, P.deep, R.d), P.fog, (1 - R.d) * .75);
    ctx.fillRect(-300, R.y - 4, W + 600, (ROWS[ri + 1] ? ROWS[ri + 1].y : H) - R.y + 8);
    if (ri === 3) {
      const ly = R.y - R.s * .35;
      ctx.save(); ctx.shadowColor = '#ff6a20'; ctx.shadowBlur = 30 * lavaK;
      ctx.fillStyle = mix(P.lava, '#5a3060', water * .7);
      ctx.beginPath(); ctx.moveTo(-300, ly + 30);
      for (let x = -300; x <= W + 300; x += 40) ctx.lineTo(x + at(R.par), ly + Math.sin(x * .01 + 1) * 10);
      for (let x = W + 300; x >= -300; x -= 40) ctx.lineTo(x + at(R.par), ly + 22 + Math.sin(x * .013) * 8);
      ctx.fill(); ctx.restore();
      ctx.fillStyle = mix(P.lavaHot, '#6a4070', water * .75);
      for (let x = -300; x <= W + 300; x += 140) { ctx.beginPath(); ctx.roundRect(x + at(R.par) + Math.sin(t + x) * 6, ly + 6, 50, 5, 3); ctx.fill(); }
    }
    const wl = lerp(R.y + 60, R.y - R.s * .22, clamp(water * 1.6 - (5 - ri) * .12));
    if (wl < R.y + 20 && ri >= 2) {
      const wg = ctx.createLinearGradient(0, wl, 0, R.y + 40); wg.addColorStop(0, mix(P.water, P.fog, (1 - R.d) * .5)); wg.addColorStop(1, mix(P.waterDeep, P.fog, (1 - R.d) * .4));
      ctx.fillStyle = wg; ctx.fillRect(-300, wl, W + 600, R.y + 60 - wl);
      ctx.fillStyle = mix(P.rim, '#ffffff', flash * .5); ctx.fillRect(-300, wl - 1, W + 600, 2 + R.d * 2);
    }
    R.rocks.forEach(k => {
      ctx.save(); ctx.translate(at(R.par), 0);
      if (wl < k.base && ri >= 2) { ctx.fillStyle = 'rgba(111,242,255,.55)'; ctx.beginPath(); ctx.ellipse(k.x, Math.max(wl, k.base - k.h * .25), k.w * .55, 5 + R.d * 6, 0, 0, Math.PI * 2); ctx.fill(); }
      const lavaLight = clamp(1 - Math.abs(k.x + at(R.par) - 820) / 700) * lavaK * (ri <= 3 ? 1 : .6);
      drawRock(k, R.d, lavaLight, flash);
      ctx.restore();
    });
    if (wl < R.y + 20 && ri >= 3) splashes.forEach((p, i) => {
      if (i % 3 !== ri - 3) return;
      const ph = (t * 2 * p.s + p.ph) % 1, x = p.x * (W + 200) - 100 + at(R.par), y = wl + 6 + p.y * (R.y + 40 - wl);
      ctx.strokeStyle = `rgba(190,245,255,${(1 - ph) * .6})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(x, y, ph * 16 * (.5 + R.d), ph * 4 * (.5 + R.d), 0, 0, Math.PI * 2); ctx.stroke();
      if (ph < .3) { ctx.fillStyle = `rgba(200,245,255,${.7 - ph * 2})`; ctx.fillRect(x - 1, y - ph * 30, 2, 5); }
    });
  });

  embers.forEach(e => {
    const ph = (t * .15 * e.s + e.ph) % 1, x = e.x * W + at(.55) + Math.sin(ph * 8 + e.ph * 10) * 14, y = 470 - ph * 300;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 30 + ph * 50);
    g.addColorStop(0, `rgba(230,220,255,${Math.sin(ph * Math.PI) * .18 * (.3 + lavaK)})`); g.addColorStop(1, 'rgba(230,220,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 80, y - 80, 160, 160);
  });

  ctx.save(); ctx.translate(at(1.3) - 40, 0);
  drawRock(cliff, 1, .25 * lavaK, flash * .6);
  ctx.restore();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const wind = .3 + Math.sin(t * .5) * .05;
  rain.forEach(L => {
    ctx.strokeStyle = `rgba(175,225,255,${L.a + flash * .3})`; ctx.lineWidth = L.w; ctx.lineCap = 'round'; ctx.beginPath();
    L.drops.forEach(([x0, y0, s]) => {
      const y = (y0 + t * L.speed * s) % (H + 80) - 40, x = ((x0 + y * wind) % (W + 400) + W + 400) % (W + 400) - 200;
      ctx.moveTo(x, y); ctx.lineTo(x - L.len * wind, y - L.len);
    });
    ctx.stroke();
  });

  const lab = smooth(.4, 1.2, t) * (1 - smooth(11.2, 11.9, t));
  ctx.save(); ctx.globalAlpha = lab; ctx.translate(lerp(30, 0, lab), 0); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(10,10,40,.5)'; ctx.shadowBlur = 8;
  ctx.font = '600 30px "Inter Display", Inter, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('Early Earth', W - 48, 64);
  ctx.font = '500 15px "Inter Display", Inter, sans-serif'; ctx.fillText(`${(4000 - Math.floor(t * 3)).toLocaleString()} Million Years Ago`, W - 48, 88);
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(W - 248, 100, 200, 2);
  ctx.fillStyle = P.accent; ctx.fillRect(W - 248, 99, 200 * (.08 + t / DUR * .03), 4);
  ctx.restore();

  const a1 = smooth(1.6, 2.4, t) * (1 - smooth(5.6, 6.2, t)), a2 = smooth(3.4, 4.2, t) * (1 - smooth(5.6, 6.2, t));
  title('It started to rain…', W * .42, 190 - (1 - a1) * 14, 58, a1);
  title('…and it didn’t stop for millions of years.', W * .42, 250 - (1 - a2) * 14, 30, a2, 600);
  const a3 = smooth(7.0, 7.8, t) * (1 - smooth(11.2, 11.9, t)), a4 = smooth(8.8, 9.6, t) * (1 - smooth(11.2, 11.9, t));
  title('Day and night, the sky poured down', W * .42, 190 - (1 - a3) * 14, 46, a3);
  title('filling the very first oceans.', W * .42, 246 - (1 - a4) * 14, 46, a4);

  ctx.globalCompositeOperation = 'overlay';
  const off = Math.floor(t * 30) * 37 % 256;
  for (let y = -off; y < H; y += 256) for (let x = -off; x < W; x += 256) ctx.drawImage(grain, x, y);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,4,24,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = smooth(0, .6, t) * (1 - smooth(11.5, 12, t));
  ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H);
}
window.render = render; window.DUR = DUR;
render(0);
</script>
</body></html>
